configuration:
  startdatum:
    name: Startdatum
    description: Ab diesem Tag wird rückwirkend gerechnet (YYYY-MM-DD). Früher als die Langzeitstatistik des Zählers geht nicht.
  statistik_netzbezug:
    name: Statistik Netzbezug
    description: Zählerstand Bezug (kWh, total_increasing), z. B. sensor.ebz_energy_in
  statistik_einspeisung:
    name: Statistik Einspeisung
    description: Zählerstand Einspeisung (kWh), z. B. sensor.ebz_energy_out
  pv_statistiken:
    name: Statistiken PV-Ertrag (optional)
    description: Zählerstände der PV-Anlagen (kWh). Nur für die Auswertung „PV-arme Tage“ beim Hausakku.
  pv_wenig_kwh_tag:
    name: PV-armer Tag unter (kWh/Tag)
  festpreis_arbeitspreis_ct_brutto:
    name: Festpreis Arbeitspreis (ct/kWh brutto)
  festpreis_grundpreis_eur_jahr_brutto:
    name: Festpreis Grundpreis (€/Jahr brutto)
  mwst_prozent:
    name: Mehrwertsteuer (%)
  netzentgelt_ct_netto:
    name: Netzentgelt Arbeitspreis (ct/kWh netto)
  aufschlag_netznutzung_ct_netto:
    name: Aufschlag besondere Netznutzung §19 (ct/kWh netto)
  kwkg_umlage_ct_netto:
    name: KWKG-Umlage (ct/kWh netto)
  offshore_umlage_ct_netto:
    name: Offshore-Umlage (ct/kWh netto)
  stromsteuer_ct_netto:
    name: Stromsteuer (ct/kWh netto)
  konzessionsabgabe_ct_netto:
    name: Konzessionsabgabe (ct/kWh netto)
  netz_grundpreis_eur_jahr_netto:
    name: Netz-Grundpreis (€/Jahr netto)
  dyn_aufschlag_ct_netto:
    name: Strombeschaffungskosten (ct/kWh netto)
    description: Prozesspauschale des Anbieters auf den Börsenpreis (Tibber 2026 – 2,15 ct brutto = 1,807 ct netto). Tibber selbst schlägt keine Marge auf, verdient nur an der Grundgebühr.
  dyn_grundgebuehr_eur_monat_brutto:
    name: Grundgebühr dynamischer Anbieter (€/Monat brutto)
  messstelle_dyn_eur_jahr_brutto:
    name: Messstellenbetrieb Smart Meter (€/Jahr brutto)
    description: Ein dynamischer Tarif braucht ein intelligentes Messsystem (iMSys). Kosten laut grundzuständigem Messstellenbetreiber.
  einspeiseverguetung_ct:
    name: Einspeisevergütung (ct/kWh)
  e_auto_vorhanden:
    name: E-Auto vorhanden
    description: Aus = keine E-Auto-Verschiebung, Bereich wird in der Ansicht ausgeblendet.
  ev_statistiken:
    name: Statistiken Wallbox-Energie
    description: Zählerstände der Wallboxen (kWh oder Wh), werden summiert.
  ev_max_kw:
    name: Max. Ladeleistung E-Autos gesamt (kW)
  ev_abend_ab_uhr:
    name: Verschiebbar für Ladestarts ab (Uhr)
  ev_fertig_bis_uhr:
    name: Laden fertig bis (Uhr)
  waermepumpe_vorhanden:
    name: Wärmepumpe vorhanden
    description: Aus = keine WP-Verschiebung, Bereich wird in der Ansicht ausgeblendet.
  wp_statistik:
    name: Statistik Wärmepumpe Energie (kWh)
  wp_leistung_statistik:
    name: Statistik Wärmepumpe Leistung (W)
    description: Wird gebraucht, um Warmwasser-Stunden (hohe Spitzenleistung) vom Heizbetrieb zu trennen.
  wp_heiz_anteil_verschiebbar:
    name: Heizung – verschiebbarer Anteil (0–1)
    description: z. B. 0.4 = 40 % des Heizstroms jeder Stunde können vor- oder nachgeholt werden (Estrich/Puffer).
  wp_heiz_fenster_h:
    name: Heizung – Verschiebefenster (± Stunden)
  wp_heiz_max_kw:
    name: Heizung – max. elektrische Leistung (kW)
  wp_heiz_mehrverbrauch_prozent:
    name: Heizung – Mehrverbrauch verschobener Energie (%)
    description: Höhere Vorlauftemperatur beim Vorheizen senkt die Effizienz.
  ww_schwelle_w:
    name: Warmwasser – Erkennungsschwelle Leistung (W)
    description: Stunden, in denen die WP mindestens diese Leistung erreicht, gelten als Warmwasserbereitung.
  ww_fenster_h:
    name: Warmwasser – Verschiebefenster (± Stunden)
  ww_max_kw:
    name: Warmwasser – max. elektrische Leistung (kW)
  ww_mehrverbrauch_prozent:
    name: Warmwasser – Mehrverbrauch (%)
    description: Speicherverluste durch früheres Aufheizen.
  wp_mindest_spread_ct:
    name: WP Mindest-Preisabstand (ct/kWh)
  hausakku_vorhanden:
    name: Hausakku vorhanden
    description: Aus = keine Akku-Netzladung, Bereich wird in der Ansicht ausgeblendet.
  akku_soc_statistik:
    name: Statistik Akku-Ladestand (%)
  akku_kapazitaet_kwh:
    name: Akku nutzbare Kapazität (kWh)
  akku_max_netzladeleistung_kw:
    name: Akku max. Netzladeleistung (kW)
  akku_wirkungsgrad:
    name: Akku Wirkungsgrad Rundlauf (0.5–1)
  akku_mindest_spread_ct:
    name: Akku Mindest-Preisabstand (ct/kWh)
    description: Netzladung nur, wenn späterer Preis × Wirkungsgrad mindestens so viel teurer ist (deckt Verschleiß ab).
  log_level:
    name: Log-Level
