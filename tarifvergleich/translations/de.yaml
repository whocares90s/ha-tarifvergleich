    name: Tibber-Aufschlag auf Börsenpreis (ct/kWh netto)
    description: Beschaffungskosten/Marge des dynamischen Anbieters. Bitte mit dem Tibber-Preisrechner für eure PLZ abgleichen.
  dyn_grundgebuehr_eur_monat_brutto:
    name: Grundgebühr dynamischer Anbieter (€/Monat brutto)
  messstelle_dyn_eur_jahr_brutto:
    name: Messstellenbetrieb Smart Meter (€/Jahr brutto)
    description: Ein dynamischer Tarif braucht ein intelligentes Messsystem (iMSys). Kosten laut grundzuständigem Messstellenbetreiber.
  einspeiseverguetung_ct:
    name: Einspeisevergütung (ct/kWh)
  ev_verschiebung:
    name: Szenario E-Auto-Ladeverschiebung
  ev_statistiken:
    name: Statistiken Wallbox-Energie
    description: Zählerstände der Wallboxen (kWh oder Wh), werden summiert.
  ev_max_kw:
    name: Max. Ladeleistung E-Autos gesamt (kW)
  ev_abend_ab_uhr:
    name: Verschiebbar für Ladestarts ab (Uhr)
  ev_fertig_bis_uhr:
    name: Laden fertig bis (Uhr)
  akku_arbitrage:
    name: Szenario Akku-Netzladung
  akku_soc_statistik:
    name: Statistik Akku-Ladestand (%)
  akku_kapazitaet_kwh:
    name: Akku nutzbare Kapazität (kWh)
  akku_max_netzladeleistung_kw:
    name: Akku max. Netzladeleistung (kW)
  akku_wirkungsgrad:
    name: Akku Wirkungsgrad Rundlauf (0.5–1)
  akku_mindest_spread_ct:
    name: Akku Mindest-Preisabstand (ct/kWh)
    description: Netzladung nur, wenn späterer Preis × Wirkungsgrad mindestens so viel teurer ist (deckt Verschleiß ab).
  wp_verschiebung:
    name: Szenario Wärmepumpen-Verschiebung
    description: Eigenes Szenario und eigene Ansicht, getrennt von E-Auto/Akku.
  wp_statistik:
    name: Statistik Wärmepumpe Energie (kWh)
  wp_anteil_verschiebbar:
    name: Verschiebbarer Anteil des WP-Netzbezugs (0–1)
    description: z. B. 0.4 = 40 % jeder Stunde können vor- oder nachgeholt werden (Fußbodenheizung/Pufferspeicher).
  wp_fenster_h:
    name: Verschiebefenster (± Stunden)
  wp_max_kw:
    name: Max. elektrische Leistung WP (kW)
  wp_mehrverbrauch_prozent:
    name: Mehrverbrauch verschobener Energie (%)
    description: Höhere Vorlauftemperatur beim Vorheizen senkt die Effizienz.
  wp_mindest_spread_ct:
    name: WP Mindest-Preisabstand (ct/kWh)
  log_level:
    name: Log-Level
